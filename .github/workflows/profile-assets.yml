# Generates the SVGs that README.md embeds: the contribution snake and the
# activity graph. Output is pushed to the `output` branch, which the README
# reads from. Every asset must be produced in this one job: the push step
# force-replaces the whole branch with the contents of dist/, so a second
# workflow pushing to `output` would erase the first one's files.
name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create output directory
        run: mkdir -p dist

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif

      # Same renderer as github-readme-activity-graph.vercel.app, run locally
      # because that hosted deployment is disabled. Pinned to a commit since
      # the action is small and runs with contents: write.
      - name: Generate activity graph (light)
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1.0.0
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=FFFFFF&color=0969DA&line=BF3989&point=24292F&area=true&area_color=8250DF&hide_border=true&custom_title=Contribution%20Graph
          output_path: dist/activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph (dark)
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1.0.0
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0D1117&color=00E7FF&line=FF2D95&point=FFFFFF&area=true&area_color=A855F7&hide_border=true&custom_title=Contribution%20Graph
          output_path: dist/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
